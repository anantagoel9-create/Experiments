<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <hr>
    <form action="">
    <label for="name">Full Name:</label>
    <input type="text" name="name" id="name" placeholder="Enter your full name">
    <br><br>
    <label for="email">Email:</label>
    <input type="text" name="email" id="email" placeholder="Enter valid email address">
    <br><br>
    <label for="pass">Password:</label>
    <input type="Password" id="pass" name="pass" placeholder="Enter password">
    <br><br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" id="gender">
    <label for="gender">Male</label>
    <input type="radio" name="gender" id="gender">
    <label for="gender">Female</label>
    <input type="radio" name="gender" id="gender">
    <label for="gender">Other</label>
    <input type="radio" name="gender" id="gender">
    <br><br>
    <label for="course">Course:</label>
    <select name="course" id="course">
        <option value="">-Select Course-</option>
        <option value="B.tech">B.tech</option>
        <option value="B.Sc">B.Sc</option>
        <option value="BA">BA</option>
        <option value="MBBS">MBBS</option>
    </select>
    <br><br>
    <label for="tel">Contact No.:</label>
    <input type="tel" id="tel" name="tel" placeholder="Enter phone number">
    <br><br>
    <label for="add">Address:</label>
    <br>
    <textarea name="add" id="add" placeholder="Enter your address"></textarea>
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">
    <hr>
    <p align="center">&copy; 2025 Student Registration Portal</p>
</form>
</body>
</html>
