<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <center>
    <fieldset>
        <form action="#" target="_self">
<h1>Hotel Room Booking Form</h1>
            <label for="name">Full Name:</label>
            <input type="text" name="name" id="name">
        <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
        <br><br>
            <label for="tel">Phone:</label>
            <input type="tel" name="tel" id="tel">
        <br><br>
             <label for="date">Check-in-Date:</label>
             <input type="date" name="date" id="date">
        <br><br>
            <label for="date">Check-out-Date:</label>
            <input type="date" name="date" id="date">
        <br><br>
              <label for="room_type">Room Type:</label>
              <select name="room_type" id="room_type">
                <option value="Single Room">Single Room</option>
                <option value="Double Room">Double Room</option>
                <option value="Grand Room">Grand Room</option>
              </select>
        <br><br>
             <label for="number">Number of Guests:</label>
             <input type="number" name="number" id="number">
        <br><br>
              <label for="requests">Select requests:</label> 
              <br> 
              <textarea name="text" id="requests" name="requests"></textarea>  
              <br><br>
              <input type="submit" name="Book Now">
              <input type="reset" name="Reset Form">          
        </form>
    </fieldset>
    </center>
</body>
</html>
